<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Just Chatting</title><link rel="stylesheet" href="style.css">
<style>
  /* Slot positions. Edit here and the preview follows. / Posições dos espaços. */
  #cam   { left:32px;   top:120px; width:1100px; height:820px; }
  #chat  { left:1180px; top:120px; width:708px;  height:820px; }
  #views { left:32px;   top:32px;  width:353px;  height:72px; }
  #lfol  { left:405px;  top:32px;  width:353px;  height:72px; }
  #lsub  { left:778px;  top:32px;  width:354px;  height:72px; }   /* the 3 cards span the webcam area: 32 to 1132 */
  #bar   { left:32px;   top:972px; width:1856px; height:76px; display:flex; align-items:center; justify-content:space-between; padding:0 36px; }
  #bar .t { font-size:44px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; text-shadow:0 0 14px color-mix(in srgb,var(--accent) 70%,transparent); }
  #bar .s { font-size:26px; font-weight:500; letter-spacing:.25em; text-transform:uppercase; color:var(--muted); }
</style></head>
<body>
<div id="cam" class="panel hole" data-box="32,120,1100,820"><div class="slot-text"><span data-o="t.webcam"></span><br><span class="dim"></span></div></div>
<div id="chat" class="panel hole"><div class="slot-text"><span data-o="t.chat"></span><br>708×820</div></div>
<div id="views" class="panel card" data-title="t.viewers"><span class="ico"><svg viewBox="0 0 48 48"><path d="M3 24Q24 6 45 24Q24 42 3 24Z"/><circle cx="24" cy="24" r="7"/><circle cx="24" cy="24" r="2.4" fill="currentColor" stroke="none"/></svg></span><div class="slot-text">0</div></div>
<div id="lfol" class="panel card" data-title="t.follower"><span class="ico"><svg viewBox="0 0 48 48"><path d="M24 40C11 31 5 24 5 16.5C5 10.5 9.5 6.5 15 6.5C19 6.5 22 8.5 24 11.5C26 8.5 29 6.5 33 6.5C38.5 6.5 43 10.5 43 16.5C43 24 37 31 24 40Z"/></svg></span><div class="slot-text" data-o="t.userName"></div></div>
<div id="lsub" class="panel card" data-title="t.sub"><span class="ico"><svg viewBox="0 0 48 48"><path d="M24 5L29.5 18L43.5 19L32.8 28.3L36.2 42L24 34.7L11.8 42L15.2 28.3L4.5 19L18.5 18Z"/></svg></span><div class="slot-text" data-o="t.userName"></div></div>
<div id="bar" class="panel"><span class="t" data-o="t.justChatting"></span><span class="s" data-o="handle"></span></div>
<script src="config.js"></script><script src="scenes.js"></script>
</body></html>
