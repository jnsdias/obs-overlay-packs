<!doctype html><html><head><meta charset="utf-8"><title>Alert media</title>
<style>
  html,body{margin:0;width:512px;height:512px;overflow:hidden;background:transparent}
  svg{position:absolute;inset:0}
  #icon{fill:none;stroke:#e0283a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  #icon *{vector-effect:none}
</style></head><body>
<svg id="stage" viewBox="0 0 512 512" width="512" height="512">
  <g id="drops"></g>
  <g id="wrap"><g id="icon" transform="translate(96 76) scale(6.4)"></g></g>
</svg>
<script>
// ?type=follow|sub|viewers   ?t=segundos (estado determinístico, para gerar quadros)   sem ?t = toca em loop
const ICONS = {
  viewers: '<path d="M3 22Q24 4 45 22Q24 40 3 22Z"/><circle cx="24" cy="22" r="7"/><ellipse cx="24" cy="22" rx="2" ry="5" fill="#e0283a" stroke="none"/><path d="M24 34Q21.4 38 21.4 40a2.6 2.6 0 0 0 5.2 0Q26.6 38 24 34Z" fill="#e0283a" stroke="none"/>',
  follow:  '<path d="M24 40C11 31 5 24 5 16.5C5 10.5 9.5 6.5 15 6.5C19 6.5 22 8.5 24 11.5C26 8.5 29 6.5 33 6.5C38.5 6.5 43 10.5 43 16.5C43 24 37 31 24 40Z"/><path d="M24 11.5L21 18L26 23L22 28L24.5 33" stroke-width="2.4"/><path d="M24 42.2Q21.8 45 21.8 46.3a2.2 2.2 0 0 0 4.4 0Q26.2 45 24 42.2Z" fill="#e0283a" stroke="none"/>',
  sub:     '<path d="M9 22a15 15 0 1 1 30 0v7q0 3-3 3h-3v6H15v-6h-3q-3 0-3-3z"/><circle cx="17.5" cy="23" r="3.5" fill="#e0283a" stroke="none"/><circle cx="30.5" cy="23" r="3.5" fill="#e0283a" stroke="none"/><path d="M24 28l-2 4h4zM20 32v6M24 32v6M28 32v6" stroke-width="2"/>'
};
const q = new URLSearchParams(location.search), type = q.get("type") || "follow", DUR = 3;
const icon = document.getElementById("icon"), wrap = document.getElementById("wrap"), drops = document.getElementById("drops");
icon.innerHTML = ICONS[type] || ICONS.follow;
if (q.has("static")) document.getElementById("drops").style.display = "none";
const NS = "http://www.w3.org/2000/svg";
const D = [[196, .55], [256, .75], [316, .95], [226, 1.2], [286, 1.4]].map(([x, t0]) => {
  const e = document.createElementNS(NS, "path"); e.setAttribute("fill", "#b3121f"); drops.appendChild(e); return { e, x, t0 };
});
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const backOut = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function render(t) {
  const pop = backOut(clamp(t / .5)), out = clamp((t - 2.5) / .5);
  const shake = t < .6 ? Math.sin(t * 90) * 7 * (1 - t / .6) : 0;
  const beat = x => Math.exp(-Math.pow(x / .09, 2));
  const ph = t % .95, pulse = q.has("static") ? 1 : type === "follow" ? 1 + .09 * (beat(ph - .12) + .65 * beat(ph - .38)) : 1 + .035 * Math.sin(t * 5);
  const s = pop * (1 - .15 * out) * pulse;
  wrap.setAttribute("transform", `translate(${256 + shake} 240) scale(${s}) translate(-256 -240)`);
  wrap.style.opacity = 1 - out;
  const glow = 14 + 10 * (.5 + .5 * Math.sin(t * 5));
  document.getElementById("stage").style.filter = `drop-shadow(0 0 ${glow}px rgba(224,40,58,.85)) drop-shadow(0 6px 4px rgba(0,0,0,.6))`;
  drops.style.opacity = 1 - out;
  D.forEach(d => {
    const dt = t - d.t0; if (dt < 0) { d.e.setAttribute("d", ""); return; }
    const grow = clamp(dt / .35), fall = Math.max(0, dt - .35);
    const y = 372 + 18 * grow + 420 * fall * fall, r = 7 + 2 * grow, len = 10 + 26 * clamp(fall * 3);
    d.e.setAttribute("d", `M${d.x} ${y - len}C${d.x - 1} ${y - r} ${d.x - r} ${y - r} ${d.x - r} ${y}a${r} ${r} 0 1 0 ${2 * r} 0C${d.x + r} ${y - r} ${d.x + 1} ${y - r} ${d.x} ${y - len}Z`);
    d.e.style.opacity = y > 500 ? 0 : 1;
  });
}
if (q.has("t")) render(parseFloat(q.get("t")));
else { const t0 = performance.now(); (function f(n) { render(((n - t0) / 1000) % (DUR + .5)); requestAnimationFrame(f); })(t0); }
</script></body></html>
